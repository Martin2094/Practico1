<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Trabajadores registrados</title>
</h:head>

<h:body>
    <h1>Trabajadores de la Salud</h1>
    <h:dataTable value="#{trabajadorSaludJSF.trabajadores}" var="trabajador" border="1">
        <h:column>
            <f:facet name="header">
                CI
            </f:facet>
            #{trabajador.CI}
        </h:column>

        <h:column>
            <f:facet name="header">
                Nombre
            </f:facet>
            #{trabajador.nombre}
        </h:column>

        <h:column>
            <f:facet name="header">
                Fecha de nacimiento
            </f:facet>
            #{trabajador.nacimiento}
        </h:column>
    </h:dataTable>
    
    <h:link value="Volver" outcome="index" />
</h:body>

</html>
